<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediVault — Medical Document Manager</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --surface-2: #f0ede8;
      --surface-3: #e8e4dd;
      --border: #ddd8cf;
      --text: #1a1714;
      --text-2: #5c574f;
      --text-3: #9c968d;
      --accent: #2d6a5a;
      --accent-light: #e8f2ef;
      --accent-2: #c4863a;
      --accent-2-light: #fdf3e7;
      --danger: #c0392b;
      --danger-light: #fdecea;
      --shadow-sm: 0 1px 3px rgba(26,23,20,0.06), 0 1px 2px rgba(26,23,20,0.04);
      --shadow: 0 4px 16px rgba(26,23,20,0.08), 0 2px 6px rgba(26,23,20,0.04);
      --shadow-lg: 0 16px 40px rgba(26,23,20,0.12), 0 6px 16px rgba(26,23,20,0.06);
      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d26;
      --surface-2: #232733;
      --surface-3: #2c3040;
      --border: #333848;
      --text: #e8e6e2;
      --text-2: #9d99a8;
      --text-3: #5f5c6b;
      --accent: #5aaf95;
      --accent-light: #1a2e28;
      --accent-2: #e09650;
      --accent-2-light: #2a1f0e;
      --danger: #e05c4a;
      --danger-light: #2a120e;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
    }
    [data-theme="high-contrast"] {
      --bg: #000000;
      --surface: #111111;
      --surface-2: #1a1a1a;
      --surface-3: #222222;
      --border: #ffffff;
      --text: #ffffff;
      --text-2: #dddddd;
      --text-3: #aaaaaa;
      --accent: #00ff99;
      --accent-light: #003322;
      --accent-2: #ffcc00;
      --accent-2-light: #332200;
      --danger: #ff4444;
      --danger-light: #330000;
      --shadow-sm: 0 0 0 1px #ffffff;
      --shadow: 0 0 0 2px #ffffff;
      --shadow-lg: 0 0 0 2px #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideRight {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes recPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
      50% { opacity: 0.85; box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    }
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .animate-fadeUp { animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both; }
    .animate-fadeIn { animation: fadeIn 0.3s ease both; }
    .animate-scaleIn { animation: scaleIn 0.35s cubic-bezier(.22,.68,0,1.2) both; }
    .animate-slideRight { animation: slideRight 0.4s cubic-bezier(.22,.68,0,1.2) both; }

    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.10s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.20s; }
    .stagger-5 { animation-delay: 0.25s; }
    .stagger-6 { animation-delay: 0.30s; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .card-elevated {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      padding: 9px 18px;
      transition: all 0.18s ease;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface-3); }
    .btn-danger {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid transparent;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border: 1px solid transparent;
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-icon {
      padding: 8px;
      border-radius: var(--radius-sm);
    }
    .btn-lg { padding: 13px 28px; font-size: 15px; border-radius: var(--radius-sm); }

    input, textarea {
      font-family: 'DM Sans', sans-serif;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      width: 100%;
      padding: 11px 14px;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45,106,90,0.12);
      background: var(--surface);
    }
    input::placeholder, textarea::placeholder { color: var(--text-3); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .badge-green { background: var(--accent-light); color: var(--accent); }
    .badge-amber { background: var(--accent-2-light); color: var(--accent-2); }
    .badge-red { background: var(--danger-light); color: var(--danger); }

    /* Overlay backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 6, 0.72);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 520px;
      padding: 28px;
    }

    /* Logo cross */
    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { display: block; }

    /* Folder grid card */
    .folder-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(.22,.68,0,1.2), box-shadow 0.22s;
      overflow: hidden;
    }
    .folder-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--folder-accent, var(--accent));
      border-radius: 3px 3px 0 0;
    }
    .folder-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }
    .folder-icon {
      font-size: 28px;
      margin-bottom: 10px;
      display: block;
    }

    /* Stat card */
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stat-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Doc card */
    .doc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .doc-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

    /* Search */
    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
    }
    .search-wrap input {
      padding-left: 38px;
    }

    /* Nav tab */
    .nav-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface-2); }
    .nav-tab.active { color: var(--accent); background: var(--accent-light); }

    /* Recording indicator */
    .rec-dot {
      width: 10px; height: 10px;
      background: var(--danger);
      border-radius: 50%;
      animation: recPulse 1.4s ease infinite;
      flex-shrink: 0;
    }

    /* Waveform bars (decorative) */
    .wave-bars { display: flex; align-items: center; gap: 3px; height: 32px; }
    .wave-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.7;
    }
    @keyframes waveBounce {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    /* Theme toggle pill */
    .theme-pill {
      display: flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
    }
    .theme-btn {
      padding: 5px 10px;
      border-radius: 99px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-3);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .theme-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .modal { padding: 20px; }
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* Tooltip-like hint */
    .hint-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-2);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      gap: 10px;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--surface-2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    /* Notification banner */
    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 14px 18px;
      z-index: 200;
      max-width: 320px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.35s cubic-bezier(.22,.68,0,1.2) both;
    }
    .notification-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ─── Icons ─────────────────────────────────────────────────────── */
const Icon = ({ d, size = 20, stroke = 1.8, fill = 'none', ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" {...rest}>
    {typeof d === 'string' ? <path d={d} /> : d}
  </svg>
);

const icons = {
  camera: <><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3" /></>,
  mic: <><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></>,
  bell: <><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>,
  folder: <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>,
  file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></>,
  logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
  search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
  trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
  share: <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></>,
  download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
  sun: <><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>,
  moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
  contrast: <><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/></>,
  x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  check: <polyline points="20 6 9 12 4 9"/>,
  arrowLeft: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
  plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
  image: <><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>,
  info: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
  user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
};

const Ico = ({ name, size = 18, className = '' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {icons[name]}
  </svg>
);

/* ─── Notification ────────────────────────────────────────────────── */
function Notification({ msg, type = 'success', onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2800);
    return () => clearTimeout(t);
  }, []);
  const colors = { success: { bg: 'var(--accent-light)', color: 'var(--accent)' }, error: { bg: 'var(--danger-light)', color: 'var(--danger)' } };
  const c = colors[type] || colors.success;
  return (
    <div className="notification">
      <div className="notification-icon" style={{ background: c.bg, color: c.color }}>
        <Ico name={type === 'success' ? 'check' : 'info'} size={16} />
      </div>
      <span style={{ fontSize: 14, fontWeight: 500, color: 'var(--text)' }}>{msg}</span>
    </div>
  );
}

/* ─── Confirm Modal ───────────────────────────────────────────────── */
function ConfirmModal({ title, message, onConfirm, onCancel }) {
  return (
    <div className="modal-backdrop animate-fadeIn" onClick={onCancel}>
      <div className="modal animate-scaleIn" style={{ maxWidth: 360 }} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
          <div className="notification-icon" style={{ background: 'var(--danger-light)', color: 'var(--danger)', width: 40, height: 40, borderRadius: 10 }}>
            <Ico name="trash" size={18} />
          </div>
          <h3 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 20, fontWeight: 400 }}>{title}</h3>
        </div>
        <p style={{ fontSize: 14, color: 'var(--text-2)', marginBottom: 24, lineHeight: 1.6 }}>{message}</p>
        <div style={{ display: 'flex', gap: 10 }}>
          <button className="btn btn-secondary" style={{ flex: 1 }} onClick={onCancel}>Cancel</button>
          <button className="btn btn-danger" style={{ flex: 1, background: 'var(--danger)', color: '#fff' }} onClick={onConfirm}>Delete</button>
        </div>
      </div>
    </div>
  );
}

/* ─── Doctor Name Modal ───────────────────────────────────────────── */
function DoctorModal({ onSave, onCancel }) {
  const [name, setName] = useState('');
  return (
    <div className="modal-backdrop animate-fadeIn" onClick={onCancel}>
      <div className="modal animate-scaleIn" style={{ maxWidth: 380 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 22, marginBottom: 6 }}>Save Voice Note</h3>
        <p style={{ fontSize: 13, color: 'var(--text-2)', marginBottom: 20 }}>Add a doctor or note label (optional)</p>
        <input placeholder="e.g. Dr. Sharma, Follow-up note…" value={name} onChange={e => setName(e.target.value)} autoFocus />
        <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
          <button className="btn btn-secondary" style={{ flex: 1 }} onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => onSave(name || 'General Note')}>Save</button>
        </div>
      </div>
    </div>
  );
}

/* ─── Main App ────────────────────────────────────────────────────── */
function MediVault() {
  const [theme, setTheme] = useState('light');
  const [isAuth, setIsAuth] = useState(false);
  const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
  const [loginId, setLoginId] = useState('');
  const [loginPw, setLoginPw] = useState('');
  const [loginErr, setLoginErr] = useState('');
  const [regName, setRegName] = useState('');
  const [regConfirmPw, setRegConfirmPw] = useState('');
  const [currentUser, setCurrentUser] = useState(null);
  const [documents, setDocuments] = useState([]);
  const [reminders, setReminders] = useState([]);
  const [selectedFolder, setSelectedFolder] = useState(null);
  const [showCamera, setShowCamera] = useState(false);
  const [showVoice, setShowVoice] = useState(false);
  const [isRecording, setIsRecording] = useState(false);
  const [voiceText, setVoiceText] = useState('');
  const finalTranscriptRef = useRef('');
  const [searchQuery, setSearchQuery] = useState('');
  const [showShare, setShowShare] = useState(null);
  const [notification, setNotification] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showDoctorModal, setShowDoctorModal] = useState(false);
  const [activeTab, setActiveTab] = useState('vault'); // vault | reminders
  const [showProfile, setShowProfile] = useState(false);

  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const recognitionRef = useRef(null);

  /* ── Token helpers ── */
  const getToken = () => localStorage.getItem('medivault_token');
  const authHeaders = () => ({
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + getToken(),
  });

  /* ── Session restore on mount ── */
  useEffect(() => {
    const token = localStorage.getItem('medivault_token');
    const savedUser = localStorage.getItem('medivault_user');
    if (token && savedUser) {
      try {
        const user = JSON.parse(savedUser);
        setCurrentUser(user);
        setIsAuth(true);
      } catch (e) {
        localStorage.removeItem('medivault_token');
        localStorage.removeItem('medivault_user');
      }
    }
  }, []);

  // Load docs when currentUser changes
  useEffect(() => {
    if (!currentUser) return;
    const token = getToken();
    if (!token) return;

    fetch(`http://localhost:5001/docs?patientId=${currentUser.id}`, {
      headers: { 'Authorization': 'Bearer ' + token },
    })
      .then(res => {
        if (res.status === 401) {
          localStorage.removeItem('medivault_token');
          localStorage.removeItem('medivault_user');
          setIsAuth(false);
          setCurrentUser(null);
          return [];
        }
        return res.json();
      })
      .then(data => { if (data) setDocuments(data); });
  }, [currentUser]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const notify = (msg, type = 'success') => {
    setNotification({ msg, type });
  };

  

  const FOLDERS = [
    { id: 'pathology', name: 'Pathology', label: 'Pathology Reports', icon: '🔬', accent: '#3b82f6' },
    { id: 'xray', name: 'Imaging', label: 'X-Rays & Scans', icon: '🩻', accent: '#8b5cf6' },
    { id: 'prescriptions', name: 'Prescriptions', label: 'Prescriptions', icon: '💊', accent: '#2d6a5a' },
    { id: 'reports', name: 'Reports', label: 'Medical Reports', icon: '📋', accent: '#c4863a' },
    { id: 'insurance', name: 'Insurance', label: 'Insurance', icon: '🛡️', accent: '#ef4444' },
    { id: 'vaccination', name: 'Vaccination', label: 'Vaccination', icon: '💉', accent: '#ec4899' },
  ];

  const handleLogin = async () => {
    try {
      const res = await fetch("http://localhost:5001/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ patientId: loginId, password: loginPw }),
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('medivault_token', data.token);
        localStorage.setItem('medivault_user', JSON.stringify(data.user));
        setCurrentUser(data.user);
        setIsAuth(true);
        setLoginErr('');
      } else {
        setLoginErr(data.message);
      }
    } catch (err) {
      setLoginErr('Server error');
    }
  };

  const handleRegister = async () => {
    if (!loginId || !regName || !loginPw || !regConfirmPw) {
      setLoginErr('All fields are required.');
      return;
    }
    if (loginPw.length < 6) {
      setLoginErr('Password must be at least 6 characters.');
      return;
    }
    if (loginPw !== regConfirmPw) {
      setLoginErr('Passwords do not match.');
      return;
    }
    try {
      const res = await fetch('http://localhost:5001/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ patientId: loginId, name: regName, password: loginPw }),
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('medivault_token', data.token);
        localStorage.setItem('medivault_user', JSON.stringify(data.user));
        setCurrentUser(data.user);
        setIsAuth(true);
        setLoginErr('');
      } else {
        setLoginErr(data.message);
      }

      setLoginErr('Server error');

  const startCamera = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      if (videoRef.current) videoRef.current.srcObject = stream;
      setShowCamera(true);
    } catch { notify('Camera access denied', 'error'); }
  };

  const capturePhoto = async () => {
    if (videoRef.current && canvasRef.current) {
      const ctx = canvasRef.current.getContext('2d');
      canvasRef.current.width = videoRef.current.videoWidth;
      canvasRef.current.height = videoRef.current.videoHeight;
      ctx.drawImage(videoRef.current, 0, 0);
      const imageData = canvasRef.current.toDataURL('image/png');
      const date = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      const newDoc = {
        type: 'photo',
        folder: selectedFolder,
        imageData,
        date,
        name: `Photo — ${date}`,
        patientId: currentUser.id   // ✅ ADD THIS
};

      await fetch("http://localhost:5001/save-doc", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(newDoc),
      });

setDocuments(prev => [...prev, newDoc]);
      stopCamera();
      notify('Photo saved successfully');
    }
  };

  const stopCamera = () => {
    if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop());
    setShowCamera(false);
  };

  /* Voice */
  const startVoice = () => {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-IN';
      finalTranscriptRef.current = '';
      rec.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            finalTranscriptRef.current += e.results[i][0].transcript + ' ';
          } else {
            interim += e.results[i][0].transcript;
          }
        }
        setVoiceText(finalTranscriptRef.current + interim);
      };
      rec.onerror = () => setIsRecording(false);
      rec.onend = () => {
        setIsRecording(false);
        if (finalTranscriptRef.current.trim()) {
          setVoiceText(finalTranscriptRef.current.trim());
        }
      };
      recognitionRef.current = rec;
      rec.start();
      setIsRecording(true);
    } else {
      notify('Speech recognition not supported. Please use Chrome.', 'error');
    }
  };

  const stopVoice = () => {
    recognitionRef.current?.stop();
    setIsRecording(false);
  };

 const saveVoiceNote = async (doctorName) => {

};

    await fetch("http://localhost:5001/save-doc", {

setDocuments(prev => [...prev, newDoc]);
    setVoiceText('');
    setShowVoice(false);
    setShowDoctorModal(false);
    notify('Voice note saved');

        await navigator.share({ title: doc.name, files: [file] });

    } else {
      const a = document.createElement('a');
      a.href = doc.imageData || `data:text/plain;charset=utf-8,${encodeURIComponent(doc.content || '')}`;

                  onChange={e => { setRegConfirmPw(e.target.value); setLoginErr(''); }}

            {loginErr && (
              <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', borderRadius: 8, padding: '10px 14px', fontSize: 13, marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>

                {isLogin ? 'Sign up' : 'Sign in'}
              </span>
            </p>
          </div>
        </div>

              <div className="animate-slideRight">
                {/* Header */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 22, flexWrap: 'wrap' }}>
                  <button className="btn btn-ghost" style={{ paddingLeft: 8 }} onClick={() => { setSelectedFolder(null); setSearchQuery(''); }}>
                    <Ico name="arrowLeft" size={16} /> Back
                  </button>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span style={{ fontSize: 22 }}>{currentFolder?.icon}</span>
                    <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 22, fontWeight: 400 }}>{currentFolder?.label}</h2>
                  </div>
                  <span className="badge badge-green" style={{ marginLeft: 'auto' }}>{filteredDocs.length} doc{filteredDocs.length !== 1 ? 's' : ''}</span>
                </div>

                {/* Action bar */}
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 18 }}>
                  <div className="search-wrap" style={{ flex: 1, minWidth: 200 }}>
                    <Ico name="search" size={16} />
                    <input type="text" placeholder="Search documents…" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                  </div>
                  <button className="btn btn-primary" onClick={startCamera}>
                    <Ico name="camera" size={16} /> Take Photo
                  </button>
                  <button className="btn btn-secondary" onClick={() => setShowVoice(true)}>
                    <Ico name="mic" size={16} /> Voice Note
                  </button>
                </div>

                {/* Documents */}
                {filteredDocs.length > 0 ? (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 14 }}>
                    {filteredDocs.map((doc, i) => (
                      <div key={doc.id} className={`doc-card animate-fadeUp`} style={{ animationDelay: `${i * 0.06}s` }}>
                        {doc.type === 'photo' && (
                          <div style={{ position: 'relative', aspectRatio: '4/3', overflow: 'hidden' }}>
                            <img src={doc.imageData} alt={doc.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                            <span className="badge badge-green" style={{ position: 'absolute', top: 8, left: 8 }}>Photo</span>
                          </div>
                        )}
                        {doc.type === 'voice-note' && (
                          <div style={{ padding: '16px 16px 0', display: 'flex', flexDirection: 'column', gap: 8 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              <div style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--accent-light)', color: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                                <Ico name="mic" size={16} />
                              </div>
                              <div>
                                <p style={{ fontSize: 12, fontWeight: 600, color: 'var(--text)' }}>{doc.doctorName}</p>
                                <span className="badge badge-amber">Voice Note</span>
                              </div>
                            </div>
                            <p style={{ fontSize: 12, color: 'var(--text-2)', lineHeight: 1.6, display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                              {doc.content}
                            </p>
                          </div>
                        )}

                        {/* Doc footer */}
                        <div style={{ padding: 14 }}>
                          <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)', marginBottom: 2 }}>{doc.name.split('—')[0].trim()}</p>
                          <p style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 12 }}>{doc.date}</p>
                          <div style={{ display: 'flex', gap: 8 }}>
                            <button className="btn btn-secondary" style={{ flex: 1, fontSize: 12, padding: '7px 10px' }} onClick={() => setShowShare(showShare === doc.id ? null : doc.id)}>
                              <Ico name="share" size={13} /> Share
                            </button>
                            <button className="btn btn-danger" style={{ flex: 1, fontSize: 12, padding: '7px 10px' }} onClick={() => setConfirmDelete(doc)}>
                              <Ico name="trash" size={13} /> Delete
                            </button>
                          </div>

                          {showShare === doc.id && (
                            <div className="animate-fadeUp" style={{ marginTop: 10, padding: '12px', background: 'var(--surface-2)', borderRadius: 10, border: '1px solid var(--border)' }}>
                              <button className="btn btn-primary" style={{ width: '100%', marginBottom: 8, fontSize: 13 }} onClick={() => shareDoc(doc)}>
                                <Ico name="share" size={14} /> Share via…
                              </button>
                              <button className="btn btn-secondary" style={{ width: '100%', fontSize: 13 }} onClick={() => shareDoc(doc)}>
                                <Ico name="download" size={14} /> Download
                              </button>
                              <button className="btn btn-ghost" style={{ width: '100%', fontSize: 12, marginTop: 4 }} onClick={() => setShowShare(null)}>
                                Cancel
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="card">
                    <div className="empty-state">
                      <div className="empty-icon"><Ico name={searchQuery ? 'search' : 'folder'} size={28} style={{ color: 'var(--text-3)' }} /></div>
                      <p style={{ fontFamily: "'DM Serif Display', serif", fontSize: 20, fontWeight: 400 }}>
                        {searchQuery ? 'No matching documents' : 'This folder is empty'}
                      </p>
                      <p style={{ fontSize: 13, color: 'var(--text-2)' }}>
                        {searchQuery ? 'Try a different search term' : 'Capture a photo or add a voice note to get started'}
                      </p>
                      {!searchQuery && (
                        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
                          <button className="btn btn-primary" onClick={startCamera}><Ico name="camera" size={15} /> Take Photo</button>
                          <button className="btn btn-secondary" onClick={() => setShowVoice(true)}><Ico name="mic" size={15} /> Voice Note</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </>
        )}

        {activeTab === 'reminders' && (
          <div className="animate-fadeUp">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 22, fontWeight: 400 }}>Reminders</h2>
              <button className="btn btn-primary" onClick={() => {
                const text = prompt('Reminder description:');
                const date = prompt('Date (e.g. 15 Apr 2026):');
                if (text && date) { setReminders(prev => [...prev, { id: Date.now(), text, date }]); notify('Reminder added'); }
              }}><Ico name="plus" size={15} /> Add Reminder</button>
            </div>

            {reminders.length === 0 ? (
              <div className="card">
                <div className="empty-state">
                  <div className="empty-icon"><Ico name="bell" size={28} style={{ color: 'var(--text-3)' }} /></div>
                  <p style={{ fontFamily: "'DM Serif Display', serif", fontSize: 20 }}>No reminders yet</p>
                  <p style={{ fontSize: 13, color: 'var(--text-2)' }}>Add medication schedules, follow-up appointments, and more</p>
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {reminders.map((r, i) => (
                  <div key={r.id} className={`card animate-fadeUp`} style={{ padding: '16px 20px', display: 'flex', alignItems: 'center', gap: 14, animationDelay: `${i * 0.06}s` }}>
                    <div style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--accent-2-light)', color: 'var(--accent-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                      <Ico name="bell" size={18} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <p style={{ fontWeight: 600, fontSize: 14 }}>{r.text}</p>
                      <p style={{ fontSize: 12, color: 'var(--text-2)' }}>{r.date}</p>
                    </div>
                    <button className="btn btn-ghost btn-icon" onClick={() => { setReminders(prev => prev.filter(x => x.id !== r.id)); notify('Reminder removed'); }}>
                      <Ico name="trash" size={16} style={{ color: 'var(--danger)' }} />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </main>

      {/* ── CAMERA MODAL ── */}
      {showCamera && (
        <div className="modal-backdrop animate-fadeIn" style={{ flexDirection: 'column', gap: 16, padding: 20 }}>
          <div style={{ width: '100%', maxWidth: 640 }}>
            <div className="animate-scaleIn" style={{ background: '#000', borderRadius: 20, overflow: 'hidden', marginBottom: 16 }}>
              <video ref={videoRef} autoPlay playsInline style={{ width: '100%', display: 'block' }} />
            </div>
            <canvas ref={canvasRef} style={{ display: 'none' }} />
            <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
              <button className="btn btn-secondary btn-lg" style={{ minWidth: 120 }} onClick={stopCamera}>Cancel</button>
              <button className="btn btn-primary btn-lg" style={{ minWidth: 160 }} onClick={capturePhoto}>
                <Ico name="camera" size={18} /> Capture
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── VOICE MODAL ── */}
      {showVoice && (
        <div className="modal-backdrop animate-fadeIn">
          <div className="modal animate-scaleIn">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
              <h3 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 22, fontWeight: 400 }}>Voice Note</h3>
              <button className="btn btn-ghost btn-icon" onClick={() => { if (isRecording) stopVoice(); setShowVoice(false); setVoiceText(''); }}>
                <Ico name="x" size={18} />
              </button>
            </div>

            {/* Recording indicator */}
            {isRecording && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, padding: '10px 14px', background: 'var(--danger-light)', borderRadius: 10 }}>
                <div className="rec-dot" />
                <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--danger)' }}>Recording…</span>
              </div>
            )}

            {/* Transcript area */}
            <div style={{ background: 'var(--surface-2)', border: '1.5px solid var(--border)', borderRadius: 12, padding: 16, minHeight: 140, marginBottom: 20, fontSize: 14, lineHeight: 1.7, color: voiceText ? 'var(--text)' : 'var(--text-3)', fontStyle: voiceText ? 'normal' : 'italic' }}>
              {voiceText || 'Tap "Start Recording" and speak clearly…'}
            </div>

            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              {!isRecording ? (
                <button className="btn btn-primary" style={{ flex: 1 }} onClick={startVoice}>
                  <Ico name="mic" size={16} /> Start Recording
                </button>
              ) : (
                <button className="btn" style={{ flex: 1, background: 'var(--danger)', color: '#fff' }} onClick={stopVoice}>
                  <div className="rec-dot" style={{ width: 8, height: 8 }} /> Stop
                </button>
              )}
              <button
                className="btn btn-secondary"
                style={{ flex: 1 }}
                disabled={!voiceText.trim()}
                onClick={() => setShowDoctorModal(true)}
              >
                Save Note
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── DOCTOR NAME MODAL ── */}
      {showDoctorModal && <DoctorModal onSave={saveVoiceNote} onCancel={() => setShowDoctorModal(false)} />}

      {/* ── CONFIRM DELETE ── */}
      {confirmDelete && (
        <ConfirmModal
          title="Delete document?"
          message={`"${confirmDelete.name}" will be permanently removed. This action cannot be undone.`}
          onConfirm={() => deleteDoc(confirmDelete.id)}
          onCancel={() => setConfirmDelete(null)}
        />
      )}

      {/* ── NOTIFICATIONS ── */}
      {notification && <Notification msg={notification.msg} type={notification.type} onDone={() => setNotification(null)} />}
    </div>
  );
}

ReactDOM.render(<MediVault />, document.getElementById('root'));
</script>
</body>
</html>
